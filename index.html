<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var m = localStorage.getItem('pg-theme') || 'system';
        if (m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <title>PG Management System</title>
    <meta name="description" content="Multi-property PG and hostel management platform for owners and tenants: configurable room/sharing layouts, tenant onboarding, KYC, and rent tracking." />
    <meta property="og:title" content="PG Management System" />
    <meta property="og:description" content="Multi-property PG and hostel management platform for owners and tenants: configurable room/sharing layouts, tenant onboarding, KYC, and rent tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
